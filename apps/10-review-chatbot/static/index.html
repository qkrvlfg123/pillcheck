<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>필체크 챗봇</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --teal:#0f6e56; --teal-deep:#085041; --teal-soft:#e1f5ee; --cream:#f7f4ec; --ink:#12312e; --amber:#ba7517; --coral:#d85a30; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Pretendard",system-ui,sans-serif; background:var(--cream); color:var(--ink); font-size:17px; }
    header { background:#fff; border-bottom:1px solid #e1f5ee; padding:16px 24px; }
    header h1 { margin:0; font-size:20px; color:var(--teal-deep); }
    header p { margin:4px 0 0; font-size:14px; color:#888; }
    .wrap { max-width:720px; margin:0 auto; padding:20px; }
    .chat { min-height:50vh; display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
    .msg { padding:14px 18px; border-radius:16px; line-height:1.65; white-space:pre-wrap; max-width:90%; }
    .user { align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
    .bot { align-self:flex-start; background:#fff; border:1px solid #e1f5ee; border-bottom-left-radius:4px; }
    .bot.risk-높음 { border-left:5px solid var(--coral); }
    .bot.risk-보통 { border-left:5px solid var(--amber); }
    .bot.risk-낮음 { border-left:5px solid var(--teal); }
    .report { font-family:ui-monospace,monospace; font-size:13.5px; background:var(--cream); padding:12px; border-radius:10px; margin-top:8px; overflow-x:auto; }
    .sources { margin-top:10px; font-size:14px; color:#666; }
    .sources b { color:var(--teal-deep); }
    .inputbar { position:sticky; bottom:0; background:var(--cream); padding:12px 0; display:flex; gap:10px; }
    input { flex:1; padding:14px 16px; border:1px solid #cfe6dd; border-radius:12px; font-size:17px; }
    button { padding:14px 22px; background:var(--teal); color:#fff; border:none; border-radius:12px; font-size:17px; cursor:pointer; }
    button:hover { background:var(--teal-deep); }
    .hint { font-size:14px; color:#999; margin-top:8px; }
    .notice { font-size:13px; color:#999; margin-top:20px; text-align:center; }
    .picker { background:#fff; border:1px solid #e1f5ee; border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .picker-head { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; }
    .picker-toggle { color:var(--teal); cursor:pointer; font-size:14px; }
    .picker-body { padding:0 16px 16px; }
    .cat { margin-bottom:12px; }
    .cat-name { font-size:13px; color:#888; margin-bottom:6px; }
    .pill { display:inline-block; margin:3px; padding:8px 14px; border:1px solid #cfe6dd; border-radius:20px; background:var(--cream); cursor:pointer; font-size:15px; }
    .pill:hover { border-color:var(--teal); }
    .pill.on { background:var(--teal); color:#fff; border-color:var(--teal); }
    .selected { margin-top:12px; font-size:14px; color:var(--teal-deep); min-height:20px; }
    .check-btn { margin-top:12px; width:100%; padding:14px; background:var(--teal); color:#fff; border:none; border-radius:12px; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>필체크 챗봇</h1>
    <p>약 상담 · 쇼핑 리뷰 분석 — 무엇이든 물어보세요</p>
  </header>

  <div class="wrap">
    <div class="chat" id="chat">
      <div class="msg bot">
        안녕하세요! 두 가지를 도와드려요.<br /><br />
        · <b>약 상담</b>: "타이레놀이랑 게보린 같이 먹어도 돼?"<br />
        · <b>쇼핑 리뷰</b>: "실버 혈압계 어때?" (리뷰 분석은 키 연동 시)<br /><br />
        약 이름을 잘 모르면 아래 <b>약 고르기</b>에서 눌러서 담아보세요.
      </div>
    </div>

    <!-- 약 고르기 -->
    <div class="picker" id="picker">
      <div class="picker-head">
        <b>약 고르기</b>
        <span class="picker-toggle" onclick="togglePicker()">펼치기 ▾</span>
      </div>
      <div class="picker-body" id="pickerBody" style="display:none;">
        <div id="categories"></div>
        <div class="selected" id="selected"></div>
        <button class="check-btn" id="checkBtn" onclick="checkSelected()" style="display:none;">
          담은 약 확인하기
        </button>
      </div>
    </div>

    <div class="inputbar">
      <input id="input" placeholder="예: 혈압약이랑 소염진통제 같이 먹어도 돼?" autocomplete="off" />
      <button onclick="send()">전송</button>
    </div>
    <div class="hint">Enter 키로도 보낼 수 있어요.</div>

    <p class="notice">
      참고용 안내이며 진단·처방이 아닙니다. 위험이 확인되면 가까운 약국·병원에서 상담하세요.
    </p>
  </div>

  <script>
    // ── 약 고르기 ──
    let selectedDrugs = [];

    async function loadCategories() {
      try {
        const res = await fetch("/common-drugs");
        const data = await res.json();
        const box = document.getElementById("categories");
        data.카테고리.forEach((cat) => {
          const div = document.createElement("div");
          div.className = "cat";
          div.innerHTML = `<div class="cat-name">${cat.이름}</div>`;
          cat.약.forEach((drug) => {
            const pill = document.createElement("span");
            pill.className = "pill";
            pill.textContent = drug;
            pill.onclick = () => toggleDrug(drug, pill);
            div.appendChild(pill);
          });
          box.appendChild(div);
        });
      } catch (e) { /* 서버 꺼져있으면 무시 */ }
    }

    function toggleDrug(drug, pill) {
      const i = selectedDrugs.indexOf(drug);
      if (i >= 0) {
        selectedDrugs.splice(i, 1);
        pill.classList.remove("on");
      } else {
        selectedDrugs.push(drug);
        pill.classList.add("on");
      }
      updateSelected();
    }

    function updateSelected() {
      const sel = document.getElementById("selected");
      const btn = document.getElementById("checkBtn");
      if (selectedDrugs.length) {
        sel.textContent = "담은 약: " + selectedDrugs.join(", ");
        btn.style.display = "block";
      } else {
        sel.textContent = "";
        btn.style.display = "none";
      }
    }

    function checkSelected() {
      if (selectedDrugs.length < 2) {
        alert("두 개 이상 담아주세요.");
        return;
      }
      input.value = selectedDrugs.join("이랑 ") + " 같이 먹어도 돼?";
      send();
      // 초기화
      selectedDrugs = [];
      document.querySelectorAll(".pill.on").forEach((p) => p.classList.remove("on"));
      updateSelected();
    }

    function togglePicker() {
      const body = document.getElementById("pickerBody");
      const toggle = document.querySelector(".picker-toggle");
      if (body.style.display === "none") {
        body.style.display = "block";
        toggle.textContent = "접기 ▴";
      } else {
        body.style.display = "none";
        toggle.textContent = "펼치기 ▾";
      }
    }

    loadCategories();

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    function addMsg(text, who, opts = {}) {
      const div = document.createElement("div");
      div.className = "msg " + who + (opts.risk ? " risk-" + opts.risk : "");
      div.innerHTML = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(escapeHtml(text), "user");
      input.value = "";
      const loading = addMsg("확인 중…", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        loading.remove();

        if (data.type === "drug") {
          let html = "";
          if (data.risk) {
            html += `<b>종합 위험도: ${data.risk}</b><br />`;
          }
          html += `<div class="report">${escapeHtml(data.report)}</div>`;
          addMsg(html, "bot", { risk: data.risk });
        } else if (data.type === "review") {
          let html = escapeHtml(data.answer);
          if (data.sources && data.sources.length) {
            html += `<div class="sources"><b>근거 리뷰:</b><br />`;
            data.sources.forEach((s) => {
              html += `· (${escapeHtml(s.product)}) ${escapeHtml(s.review)}<br />`;
            });
            html += `</div>`;
          }
          addMsg(html, "bot");
        } else {
          addMsg(escapeHtml(JSON.stringify(data)), "bot");
        }
      } catch (err) {
        loading.remove();
        addMsg("오류가 났어요. 서버가 켜져 있는지 확인해 주세요.", "bot");
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
